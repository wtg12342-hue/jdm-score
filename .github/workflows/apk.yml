name: apk
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apk.yml', '.github/apk/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: build
        run: |
          mkdir -p ~/.android && cp .github/apk/test.keystore ~/.android/debug.keystore
          cd .github/apk/twa && (gradle assembleDebug --no-daemon > /tmp/build.log 2>&1 || (mkdir /tmp/lg && cd /tmp/lg && tail -c 20000 /tmp/build.log > build.log && git init -q -b apklog && git config user.name gh && git config user.email gh@users.noreply.github.com && git add . && git commit -qm log && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apklog; exit 1))
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/JDM-Score.apk && ls -la /tmp/JDM-Score.apk
      - name: publish to apk branch
        run: |
          mkdir /tmp/out && cd /tmp/out && cp /tmp/JDM-Score.apk . && git init -q -b apk
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add . && git commit -qm "apk ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
